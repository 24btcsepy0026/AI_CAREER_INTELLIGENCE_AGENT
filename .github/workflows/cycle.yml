name: Cycle Run

on:
  schedule:
    # 06:00 IST (Indian Standard Time) is 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Migrate Database
        run: python -m edgedash.storage --migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Cycle
        run: |
          # pipefail: if python fails, the entire step fails (tee would otherwise mask it)
          set -o pipefail
          python run_cycle.py 2>&1 | tee cycle.log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: "utf-8"

      - name: Upload Cycle Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-log
          path: cycle.log
