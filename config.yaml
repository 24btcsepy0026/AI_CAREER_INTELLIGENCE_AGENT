  "gcp":
    - "google cloud"
    - "google cloud platform"
    - "google cloud platform (gcp)"

  "aws":
    - "amazon web services"

  # ── Containers / Infra ─────────────────────────────────────────────────
  "kubernetes":
    - "k8s"
    - "docker and kubernetes"
    - "containerization and orchestration (docker, kubernetes)"

  "ci/cd":
    - "ci cd"
    - "cicd"
    - "ci/cd pipelines"
    - "git/gitlab ci pipelines"

  "infrastructure as code":
    - "infrastructure-as-code"
    - "iac"
    - "infrastructure as code (terraform)"

  # ── Databases ──────────────────────────────────────────────────────────
  "postgresql":
    - "postgres"
    - "psql"

  "sql":
    - "mysql"
    - "t-sql"
    - "pl/sql"
    - "sql queries"
    - "sql/mysql"
    - "sql server"

  # ── Languages ──────────────────────────────────────────────────────────
  "python":
    - "python3"
    - "python 3"
    - "python or a comparable language"
    - "c# or python"

  "c#":
    - "c# .net / .net core"
    - "entity framework für ms sql-server"

  "typescript":
    - "typescript/javascript"

  # ── BI / Visualisation ─────────────────────────────────────────────────
  "power bi":
    - "powerbi"
    - "power-bi"
    - "ms power bi"
