target_role: "Data Analyst"
target_city: "Bengaluru"
keywords:
  - "data analyst"
  - "SQL"
  - "Python"
  - "Power BI"
  - "Tableau"
  - "ETL"
my_skills:
  - "Python"
  - "SQL"
  - "Excel"
  - "Pandas"
  - "NumPy"
  - "data visualisation"
experience_years: 2
db_path: "edgedash.db"
min_fit_score: 60

# Sources to enable. Each name must exist in the SOURCES registry.
sources:
  - "arbeitnow"

# Set to true to skip all network calls and use MockFetcher instead.
# Useful for offline development or CI runs.
use_mock_fetcher: false

# LLM provider: "gemini" (needs GEMINI_API_KEY in .env) or "ollama" (local, no key)
llm_provider: "gemini"
llm_model: "gemini-flash-lite-latest"

# --- Scoring weights (must sum to 1.0) ---
# Tune these without touching any code.
target_seniority: "mid"      # junior | mid | senior | lead
score_batch_size: 25         # max listings scored per cycle (rule 21)
weight_skill_match:   0.45
weight_seniority_fit: 0.25
weight_location_fit:  0.15
weight_recency:       0.15

# --- Skill alias map (rule 23) ---
# THIS MAP IS MINE TO EDIT. Adding entries is expected as I see my own data.
# canonical name (left) -> list of aliases (right) that collapse to it.
# Rule: when unsure, leave skills SEPARATE. Fragmentation you can see beats
# tidiness you can't check. Never merge skills that have different hiring meanings.
