# --- Orchestration thresholds (rule 29) ---
# The Orchestrator reads these to set explicit stop conditions per agent.
fetch_interval_hours: 6      # run Fetcher if last fetch was >= this many hours ago
score_max_seconds:    300    # Scorer hard time ceiling per cycle
analyse_max_seconds:  120    # GapAnalyzer hard time ceiling per cycle
fetch_max_pages:      5      # max pages Fetcher may request per source
fetch_max_listings:   500    # max raw listings Fetcher may store per cycle

# --- Verification thresholds (edgedash/verification.py) ---
# Every threshold is named after the failure mode it catches.
# Tighten them as your dataset grows; loosen them only with a reason.

# check_score_spread — catches score compression / inflation.
# A model that gives every listing ~the same score is useless.
min_score_spread:  10     # FAIL if max(scores) - min(scores) < this
min_score_stdev:   5.0    # FAIL if stdev of scores < this

# check_extraction_sanity — catches a broken or hallucinating extractor.
# An extractor that returns [] for most listings has silently failed.
# An extractor that returns a 25-word sentence as one "skill" has lost the plot.
max_empty_extraction_pct: 20.0   # FAIL if % of listings with empty required_skills > this
max_skills_per_listing:   40     # FAIL if any single listing has more required skills than this

# check_gap_sample_size — catches ranking a rumour.
# A gap seen in only 1-2 listings has high variance and low signal.
min_gap_sample:  3    # FAIL if the top-ranked gap came from fewer listings than this

# check_freshness — catches stale data that makes recency scores meaningless.
max_data_age_days:  3    # FAIL if the newest listing is older than this many days
